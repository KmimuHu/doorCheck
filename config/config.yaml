app:
  name: 智能设备产测工具
  version: '2.9'
device:
  heartbeat_interval: 30
  product_id: '1696'
  psk: weidian_24h
  timeout: 10
mdns:
  service_type: _mqtt._tcp.local.
  timeout: 5
mqtt:
  allow_anonymous: true
  broker: 22.0.0.1
  broker_mode: local
  keepalive: 60
  port: 1881
  qos: 1
  require_certificate: false
  use_identity_as_username: false
printer:
  dpi: 600
  enabled: true
  paper_height: 30
  paper_width: 50
  printer_name: Xprinter XP-T271U
  protocol: auto
  tspl_layout:
    border:
      thickness: 2
      x1: 2
      x2: 398
      y1: 2
      y2: 238
    date:
      font: '1'
      rotation: 0
      x: 120
      x_scale: 1
      y: 124
      y_scale: 1
    qrcode:
      cell_width: 6
      x: 245
      y: 69
    sn:
      font: '1'
      rotation: 0
      x: 34
      x_scale: 1
      y: 178
      y_scale: 1
  zpl_layout:
    render_mode: bitmap        # bitmap(位图渲染,字体可控) | native(打印机内置字体)
    font_path: assets/fonts/label.ttf   # 位图渲染使用的字体文件(相对工程根目录或绝对路径)
    date:
      font_size: 40
      x: 300
      y: 388
    qrcode:
      error_correction: M
      box_size: 13            # 每个二维码模块的点数(越大二维码越大)
      x: 770
      y: 300
    sn:
      font_size: 40
      x: 77
      y: 512
test:
  ble_rssi_threshold: -70
  discover_duration: 5000
  ir_strict_verify: true
  open_duration: 5000
  retry_count: 3
  sle_min_count: 1
  test_timeout: 30
  verify_state: true
  wifi_rssi_threshold: -40
ui:
  layout_mode: 4
  remember_layout: false
  speaker_type: outdoor
